[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-audio-selector"
version = "0.1.0"
description = "Route Linux audio to network speakers and synchronized Snapcast clients."
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.6",
  "zeroconf>=0.132",
  "pychromecast>=14.0",
  "async-upnp-client>=0.40",
]

[project.scripts]
network-audio = "network_audio_selector.cli:main"
network-audio-ui = "network_audio_selector.ui:main"
network-audio-service = "network_audio_selector.service:main"

[project.optional-dependencies]
alexa = ["alexapy>=1.33,<2"]

[tool.setuptools.packages.find]
where = ["src"]
